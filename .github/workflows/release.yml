# 自动发布：main 上的 versionName 还没发布过时，跑单元测试 → 编译并签名 release 包 → 创建 Release（同时打 vX.Y 标签）并上传 APK
#
# 触发：
#   - 推送到 main（合并 PR 后）：版本号没变、已经发布过的直接跳过
#   - 推送 v* 标签（本机手动发版）：标签必须和 versionName 一致
#   - Actions 页面手动 Run workflow（补发 / 重试）
#
# 需要在仓库 Settings → Secrets and variables → Actions 里配置（见 README「发布」一节）：
#   SIGN_KEY_BASE64  签名密钥文件（.jks）的 base64
#   SIGN_KEY_ALIAS   密钥别名
#   SIGN_KEY_PWD     密码（密钥库和密钥同一个）
#
# 发布说明取自 .github/release-notes/<标签>.md，没有这个文件就用 GitHub 自动生成的提交列表。
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# 合并和打标签几乎同时触发时排队执行，后一个会看到已发布而跳过
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 确定版本，已发布过的跳过
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          tag="v$name"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "::error::标签 $GITHUB_REF_NAME 和 versionName $name 不一致"; exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "::notice::$tag 已发布，跳过"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 检查签名配置
        if: steps.ver.outputs.skip != 'true'
        env:
          SIGN_KEY_BASE64: ${{ secrets.SIGN_KEY_BASE64 }}
          SIGN_KEY_ALIAS: ${{ secrets.SIGN_KEY_ALIAS }}
          SIGN_KEY_PWD: ${{ secrets.SIGN_KEY_PWD }}
        run: |
          # 没签名的包没法覆盖安装，宁可失败也不发
          for v in SIGN_KEY_BASE64 SIGN_KEY_ALIAS SIGN_KEY_PWD; do
            if [ -z "${!v}" ]; then echo "::error::缺少 Secret：$v（配置后在 Actions 页面重新运行即可）"; exit 1; fi
          done

      - uses: actions/setup-java@v4
        if: steps.ver.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        if: steps.ver.outputs.skip != 'true'

      - name: 安装 Android SDK 组件
        if: steps.ver.outputs.skip != 'true'
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" > /dev/null

      - name: 单元测试
        if: steps.ver.outputs.skip != 'true'
        run: bash ./gradlew --no-daemon :app:testDebugUnitTest

      - name: 编译签名包
        if: steps.ver.outputs.skip != 'true'
        env:
          TAG: ${{ steps.ver.outputs.tag }}
          SIGN_KEY_BASE64: ${{ secrets.SIGN_KEY_BASE64 }}
          SIGN_KEY_ALIAS: ${{ secrets.SIGN_KEY_ALIAS }}
          SIGN_KEY_PWD: ${{ secrets.SIGN_KEY_PWD }}
        run: |
          echo "$SIGN_KEY_BASE64" | base64 -d > "$RUNNER_TEMP/sign.jks"
          bash ./gradlew --no-daemon :app:assembleRelease \
            -PmoSignKeyFile="$RUNNER_TEMP/sign.jks" \
            -PmoSignKeyAlias="$SIGN_KEY_ALIAS" \
            -PmoSignKeyPwd="$SIGN_KEY_PWD"
          rm -f "$RUNNER_TEMP/sign.jks"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk "MediaOrganizer-$TAG.apk"

      - name: 创建 Release
        if: steps.ver.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          notes=".github/release-notes/$TAG.md"
          if [ -f "$notes" ]; then set -- --notes-file "$notes"; else set -- --generate-notes; fi
          # 标签不存在时按当前提交新建
          gh release create "$TAG" "MediaOrganizer-$TAG.apk" --target "$GITHUB_SHA" \
            --title "影视整理 $TAG" "$@"
